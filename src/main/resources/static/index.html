<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>GST BILLING</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    
    <form id="register" style="display:none;">
         <h2>Sign Up</h2>
        <input id="businessName" type="text" placeholder="Enter Business Name" >
        <input id="gst" type="text" placeholder="Enter GSTIN" >
        <input id="address" type="text" placeholder="Enter Address" >
        <input id="mob" type="text" placeholder="Enter Mobile Number">
        <input id="email" type="email" placeholder="Enter Email" >
        <input id="username" type="text" placeholder="Create UserName">
        <input id="password" type="password" placeholder="Create Password">
        <input id="confirm_password" type="password" placeholder="Confirm Password" >
        <button class="btn" type="submit">Sign Up</button>
    </form>

    <form id="login">
        <h2>Sign In</h2>
        <input id="loginUser" type="text" placeholder="Enter UserName">
        <input id="loginPass" type="password" placeholder="Enter Password">
        
     <button class="btn" type="submit">Sign In</button>
     <a onclick="showRegister()" href="#">New User? Sign Up</a>  
    </form>
    
    
    </div>
<script src="script.js"> </script>
</body>    
</html>
