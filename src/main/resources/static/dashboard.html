<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>DashBoard</title>
        <link rel="stylesheet" href="dashboard.css">
    </head>

<body>
    <div class="sidebar">
        <h2>INVENTO</h2>
        <ul>
            <li onclick="showSection('products')">Products</li>
            <li onclick="showSection('customers')">Customers</li>
            <li onclick="showSection('billing')">Billing</li>
            <li onclick="showSection('sales')">Sales Analytics</li>
            <li onclick="logout()">Logout</li>
        </ul>
    </div>

    <div class="main-content">
        <!----Products section---->
        <div id="products" class="section">
            <h2>Products</h2>
            <button id="openProductForm">Create Stock</button>

        <form id="productForm" class="hidden">
            <input type="text" id="productName" placeholder="Product Name">
            
            <select id="category" class="category-select">
            <option value="">Select Category</option>
            <option value="electronics">Electronics</option>
            <option value="food">Food</option>
            <option value="clothing">Clothing</option>
            <option value="books">Stationery & Office Supplies</option>
            </select>
            <input type="number" id="productQty" placeholder="Quantity">
            <input type="number" id="productPrice" placeholder="Price" step="0.01">
            <button id="ProductFormSubmit" type="submit">Add Product</button>
        </form>

        <h3>All Products</h3>
        <div id="productList"></div>

        </div>

        <!---Customers Section-->
        <div id="customers" class="section" style="display:none;">
        <h2>Customers</h2>
        <button id="openCustomerForm">Add Customer</button>
        <form id="customerForm" class="hidden">
            <input type="text" id="customerName" placeholder="Customer Name">
            <input type="text" id="customerGst"  placeholder="Customer GSTIN">
            <input type="text" id="customerPhone" placeholder="Phone">
            <select id="state" class="state-select">
    <option value="">Select State / UT</option>

    <!-- States -->
    <option value="Andhra Pradesh">Andhra Pradesh</option>
    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
    <option value="Assam">Assam</option>
    <option value="Bihar">Bihar</option>
    <option value="Chhattisgarh">Chhattisgarh</option>
    <option value="Goa">Goa</option>
    <option value="Gujarat">Gujarat</option>
    <option value="Haryana">Haryana</option>
    <option value="Himachal Pradesh">Himachal Pradesh</option>
    <option value="Jharkhand">Jharkhand</option>
    <option value="Karnataka">Karnataka</option>
    <option value="Kerala">Kerala</option>
    <option value="Madhya Pradesh">Madhya Pradesh</option>
    <option value="Maharashtra">Maharashtra</option>
    <option value="Manipur">Manipur</option>
    <option value="Meghalaya">Meghalaya</option>
    <option value="Mizoram">Mizoram</option>
    <option value="Nagaland">Nagaland</option>
    <option value="Odisha">Odisha</option>
    <option value="Punjab">Punjab</option>
    <option value="Rajasthan">Rajasthan</option>
    <option value="Sikkim">Sikkim</option>
    <option value="Tamil Nadu">Tamil Nadu</option>
    <option value="Telangana">Telangana</option>
    <option value="Tripura">Tripura</option>
    <option value="Uttar Pradesh">Uttar Pradesh</option>
    <option value="Uttarakhand">Uttarakhand</option>
    <option value="West Bengal">West Bengal</option>

    <!-- Union Territories -->
    <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
    <option value="Chandigarh">Chandigarh</option>
    <option value="Dadra and Nagar Haveli and Daman and Diu">
        Dadra and Nagar Haveli and Daman and Diu
    </option>
    <option value="Delhi">Delhi</option>
    <option value="Jammu and Kashmir">Jammu and Kashmir</option>
    <option value="Ladakh">Ladakh</option>
    <option value="Lakshadweep">Lakshadweep</option>
    <option value="Puducherry">Puducherry</option>
</select>
            <button type="submit">Add Customer</button>
        </form>

        <h3>All Customers</h3>
        <div id="customerList"></div>
        <!--Billing Section-->



        <!---Sales Analytics Secttion-->



    
    
    
    
    
    
    
    
    
    
    </div>
    
    
    
    
    
    




<script src="dashboard.js"></script>
</body>
</html>
